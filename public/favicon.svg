<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stem-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D2240"/>
      <stop offset="100%" stop-color="#0A1A30"/>
    </linearGradient>
  </defs>

  <!-- Dark navy vertical stem of the F -->
  <rect x="8" y="8" width="20" height="84" rx="4" fill="url(#stem-grad)"/>

  <!-- Top horizontal bar (dark navy) -->
  <rect x="8" y="8" width="72" height="20" rx="4" fill="url(#stem-grad)"/>

  <!-- Middle horizontal bar (teal) — shorter, offset from stem -->
  <rect x="28" y="42" width="48" height="18" rx="4" fill="#2DB899"/>

  <!-- Teal top-bar accent overlay (right portion of top bar) -->
  <rect x="48" y="8" width="32" height="20" rx="4" fill="#2DB899"/>
</svg>
